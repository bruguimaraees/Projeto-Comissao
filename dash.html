<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vendas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f7f6;
        }

        /* Menu Lateral */
        aside {
            width: 250px;
            background-color: #1e1e2d;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        aside h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #708bdf;
        }

        aside a {
            color: #a2a2b5;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        aside a:hover, aside a.active {
            background-color: #2a2a3c;
            color: #fff;
        }

        /* Conteúdo Principal */
        main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        /* Cards de Resumo */
        .cards-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        /* Seção do Gráfico e Últimas Vendas */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .box h3 {
            margin-bottom: 15px;
            color: #444;
            font-size: 16px;
        }

        .grafico-placeholder {
            height: 200px;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            border-radius: 6px;
            border: 2px dashed #ddd;
        }

        /* Tabela de Últimas Vendas */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        table th {
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <aside>
        <h2>Painel de Vendas</h2>
        <a href="#" class="active">Home / Dashboard</a>
        <a href="index.html">Cadastro de Venda</a>
        <a href="#">Consulta de Venda</a>
        <a href="#">Consulta Comissão</a>
        <a href="#">Onboarding</a>
    </aside>

    <!-- Conteúdo Principal -->
    <main>
        <header>
            <h1>Visão Geral do Mês</h1>
        </header>

        <!-- Cards com os Valores -->
        <div class="cards-container">
            <div class="card">
                <h3>Valor Acumulado (Mês)</h3>
                <p id="card-acumulado"></p>
            </div>
            <div class="card">
                <h3>Média de Vendas</h3>
                <p id="card-media"></p>
            </div>
            <div class="card">
                <h3>Total de Vendas</h3>
                <p id="card-total"></p>
            </div>
        </div>

        <!-- Seção Gráfico e Últimas Vendas -->
            <div class="dashboard-grid">

                <!-- Caixa do Gráfico -->
                <div class="box">
                    <h3>Gráfico da Média das Vendas</h3>
                    
                    <!-- A jaula do gráfico (substitui o antigo placeholder) -->
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="graficoVendas"></canvas>
                    </div>
                </div>

            <div class="box">
                <h3>Últimas Vendas</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-ultimas-vendas">
                    
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
