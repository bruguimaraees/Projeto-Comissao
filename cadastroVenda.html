<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Venda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f7f6;
        }

        /* Menu Lateral (Exatamente igual ao Dash) */
        aside {
            width: 250px;
            background-color: #1e1e2d;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        aside h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #007BFF; /* Mudei para Azul aqui também! */
        }

        aside a {
            color: #a2a2b5;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        aside a:hover, aside a.active {
            background-color: #2a2a3c;
            color: #fff;
        }

        /* Conteúdo Principal */
        main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            text-align: center; /* <-- Adicionado para centralizar o texto do título */
        }

        /* Caixa Branca */
        .box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 500px; 
            width: 100%; /* <-- Garante que a caixa não vai encolher */
            margin: 0 auto; /* <-- O TRUQUE MÁGICO: Centraliza a caixa no meio da tela! */
        }

        /* Estilos do Formulário */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #007BFF;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007BFF; /* Botão Azul */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        #texto-resultado {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <aside>
        <h2>Painel de Vendas</h2>
        <!-- Voltei o link para o dash.html -->
        <a href="dash.html">Home / Dashboard</a> 
        
        <!-- Agora o ativo é a página de cadastro -->
        <a href="cadastroVenda.html" class="active">Cadastro de Venda</a> 
        <a href="#">Consulta de Venda</a>
        <a href="#">Consulta Comissão</a>
        <a href="#">Onboarding</a>
    </aside>

    <!-- Conteúdo Principal -->
    <main>
        <header>
            <h1>Cadastrar Nova Venda</h1>
        </header>

        <!-- A caixa branca com o formulário dentro -->
        <div class="box">
            <label>Nome do Cliente:</label>
            <input type="text" id="nome-cliente" placeholder="Ex: Empresa Exemplo">

            <label>Data da Venda:</label>
            <input type="date" id="data-venda">

            <label>Valor da Venda (R$):</label>
            <input type="number" id="valor-da-venda" placeholder="Ex: 9000">

            <label>Meses de Desconto:</label>
            <input type="number" id="meses-desconto" placeholder="Ex: 3">
            
            <button id="botao-salvar">Salvar venda</button>
            
            <p id="texto-resultado"></p>
        </div>
    </main>

    <!-- Puxa o seu script para o botão funcionar -->
    <script src="script.js"></script>

</body>
</html>
