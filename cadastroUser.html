<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <!-- Vamos usar o mesmo arquivo de estilo para manter a identidade visual! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="painel-sistema">
        <h2>Criar Nova Conta</h2>
        
        <label>Nome Completo:</label>
        <input type="text" id="nome-usuario" placeholder="Ex: João Silva">

        <label>E-mail:</label>
        <input type="email" id="email-usuario" placeholder="joao@email.com">
        
        <label>Senha:</label>
        <!-- O type="password" faz as bolinhas pretas aparecerem no lugar das letras -->
        <input type="password" id="senha-usuario" placeholder="Crie uma senha forte">
        
        <button id="botao-cadastrar">Cadastrar Usuário</button>
        
        <!-- Um link para voltar para o login, caso ele já tenha conta no futuro -->
        <p><a href="login.html">Já tem uma conta? Faça login aqui</a></p>
    </div>

</body>
</html>
